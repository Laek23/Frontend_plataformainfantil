          }
          const num = b.querySelector('span');
          if (num) {
            num.className = 'font-display-hero-mobile text-display-hero-mobile text-on-surface';
          }
        });

        btn.classList.remove('bg-surface-container-lowest', 'shadow-[0_5px_0px_#ccdcf0]');

        }
        const num = btn.querySelector('span');
        if (num) {
          num.className = 'font-display-hero-mobile text-display-hero-mobile text-on-tertiary-fixed font-bold';
        }
      });
    });

    submitBtn.addEventListener('click', () => {
      submitBtn.classList.add('scale-95');
      setTimeout(() => submitBtn.classList.remove('scale-95'), 150);
      banner.classList.remove('hidden');
    });

    audioBtn.addEventListener('click', () => {
